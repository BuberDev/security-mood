<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glow)" />

  <!-- Grid overlay -->
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Tactical Circles -->
  <circle cx="400" cy="260" r="140" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.15" fill="none" />
  <circle cx="400" cy="260" r="160" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="10 15" fill="none" />
  <circle cx="400" cy="260" r="120" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.25" fill="none" />

  <!-- Cross / Survival Icon -->
  <g transform="translate(370, 230)">
    <rect x="0" y="20" width="60" height="20" fill="url(#goldGrad)" rx="4" />
    <rect x="20" y="0" width="20" height="60" fill="url(#goldGrad)" rx="4" />
  </g>

  <!-- Infographic text ("tablon") -->
  <text x="400" y="470" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4" text-anchor="middle">EMERGENCY PREP</text>
  <text x="400" y="515" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="700" font-size="18" fill="url(#goldGrad)" letter-spacing="8" text-anchor="middle">GRID-DOWN READINESS</text>
</svg>
